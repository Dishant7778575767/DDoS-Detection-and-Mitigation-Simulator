[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentrix-backend"
version = "0.1.0"
description = "SENTRIX DDoS Defense Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "python-dotenv",
    "sqlalchemy",
    "alembic",
    "psycopg2-binary>=2.9.9",
    "pg8000>=1.30.0",
    "scikit-learn",
    "joblib",
    "pandas",
    "numpy",
    "httpx2",
    "PyYAML",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::ResourceWarning",
    "ignore::sklearn.exceptions.InconsistentVersionWarning",
]
